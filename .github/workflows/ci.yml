name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI-only dummy values. next build only validates SHAPE (lib/env.ts is a Zod schema,
      # not a live connection check) — nothing here ever reaches a real z.ai or Neon host.
      # NEVER put a real secret in this block; see docs/plans/F01-foundation.md section 4.
      #
      # One key, both endpoints (R-40). There is deliberately no LLM_VISION_API_KEY.
      LLM_API_KEY: ci-dummy-key
      LLM_VISION_BASE_URL: https://api.z.ai/api/coding/paas/v4
      LLM_VISION_MODEL: glm-4.6v
      LLM_BASE_URL: https://api.z.ai/api/anthropic
      LLM_MODEL: glm-5.3
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/ci
      # F02. `auth.ts` calls authEnv() at module scope, so `next build`'s page-data collection
      # reaches it for every protected route. AUTH_URL stays UNSET on purpose — it is production
      # only, and Auth.js infers the origin from the request everywhere else (roadmap §4.1).
      AUTH_SECRET: ci-dummy-secret
      AUTH_GOOGLE_ID: ci-dummy-google-id
      AUTH_GOOGLE_SECRET: ci-dummy-google-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # package-lock.json was written by npm 12, which records
      # node_modules/vitest/node_modules/@esbuild/aix-ppc64 with os:["aix"] but WITHOUT
      # optional:true. Older npm (the one bundled with the Node 22 image) then treats that
      # entry as a required dependency and `npm ci` dies with EBADPLATFORM on linux/x64.
      # Pinning npm to the version that wrote the lockfile is the fix; do not "solve" this
      # with --no-optional (that removes the esbuild binary vitest needs) or by swapping in
      # `npm install` (that discards the lockfile's determinism).
      - name: Pin npm to the version that wrote package-lock.json
        run: npm i -g npm@12.0.1

      - run: npm ci

      # Roadmap section 4.1's literal requirement, given a real exit code (Task 23).
      - name: OPENROUTER_API_KEY boundary guard
        run: npm run ci:openrouter-guard

      # F03's two grep-able invariants: the extractions audit trail has no delete path, and
      # getRunByShareToken is still the only unscoped read. Both are security/data-integrity
      # properties that a unit test can only assert about code it happens to import.
      - name: Data-layer invariant guard
        run: npm run ci:data-layer-guard

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Runs tests/research/score.test.ts among everything else — the D13 requirement.
      # No network call happens in this step; see Task 22's rationale for why score.mjs
      # specifically is CI-safe and the rest of research/ deliberately is not.
      - run: npm test

      - run: npm run build
